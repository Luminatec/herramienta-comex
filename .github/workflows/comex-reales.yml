name: Sync comex_odoo_real.json

on:
  schedule:
    - cron: "40 11 * * *"  # 11:40 UTC = 08:40 ART
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr job de reales COMEX (Odoo -> SharePoint)
        env:
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
        run: python scripts/comex_reales.py
