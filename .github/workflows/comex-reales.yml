name: Sync comex_odoo_real.json

on:
  schedule:
    - cron: "40 11 * * *"  # 11:40 UTC = 08:40 ART
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sync del tablero Odoo en modo prueba: muestra lo que haria sin escribir en Odoo ni en comex_data.json"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests de la logica de sync (sin red)
        run: python -m unittest discover -s tests

      - name: Correr job COMEX (Odoo -> SharePoint, tablero Odoo, writeback de campos de mano)
        env:
          ODOO_LOGIN: ${{ secrets.ODOO_LOGIN }}
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          COMEX_SYNC_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python scripts/comex_reales.py
